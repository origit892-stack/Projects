<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chat Bridge</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand"><span class="logo">⇄</span><h1>Chat Bridge</h1><span class="ver">v2</span></div>
  </header>
  <main>
    <section id="status" class="card muted">Checking…</section>
    <section id="providers" class="card"></section>
    <section id="send-box" class="card hidden">
      <label for="allowSend"><input type="checkbox" id="allowSend" /> Allow Agent to send messages</label>
      <p class="hint">Only in the open, visible provider tab. The agent never reads typed-but-unsent drafts.</p>
    </section>
    <section id="last-error" class="error hidden"></section>
  </main>
  <footer>
    <a id="settings" href="options.html">Settings</a>
    <button id="rotate" class="ghost">Rotate token</button>
    <button id="retry" class="ghost hidden">Retry</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>body{width:360px;max-height:560px;overflow:auto;background:#f6f9ff;font-family:Arial,sans-serif;color:#173154;padding:14px;margin:0}h2{margin:0;color:#225dcc}.note{font-size:12px;line-height:1.7;color:#617998}.btn{background:#245dcc;color:white;border:none;border-radius:9px;padding:10px;width:100%;font-weight:bold;cursor:pointer;margin-top:10px}select,textarea,input{width:100%;box-sizing:border-box;border:1px solid #ccdaf1;border-radius:8px;padding:9px;margin:6px 0}textarea{height:76px}.item{border:1px solid #dbe7f8;border-radius:9px;background:#fff;padding:9px;margin:7px 0}label{display:block;font-size:12px;font-weight:bold}.small{font-size:12px}.remove{border:0;background:#ffeded;color:#a12e2e;border-radius:6px;padding:5px 9px;cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center}.error{color:#b33}</style></head><body><h2>לומיו Reader ✦</h2><p class="note">פתח משימות באתר שבו התחברת בעצמך. התוסף קורא רק טקסט גלוי מהעמוד הנוכחי, לא עוגיות, סיסמאות או תוכן מוסתר.</p><label>מערכת המקור<select id="source"><option value="mashov">משו״ב</option><option value="ofek">אופק</option><option value="petel">פטל</option><option value="shahaf">שחף</option></select></label><button id="scan" class="btn">חיפוש משימות בעמוד הפתוח</button><p id="info" class="note"></p><div id="items"></div><button id="add" class="btn" style="background:#e7efff;color:#245dcc">+ הוסף משימה ידנית מהרשימה</button><label>כתובת לומיו שלך<input id="lumioUrl" type="url" placeholder="http://localhost:5173" value="http://localhost:5173"></label><button id="send" class="btn">העבר את המשימות ללומיו בלחיצה אחת</button><button id="download" class="btn" style="background:#e7efff;color:#245dcc">הורדת קובץ — חלופה</button><script src="popup.js"></script></body></html>
